name: Release page

# Rebuilds site/data/releases.json from every product's GitHub releases and deploys the page to
# GitHub Pages. The product repositories stay where they are: their auto-updaters read latest.json
# from their own releases, so this repository only indexes them.

# TAKEN OFFLINE 2026-10-20: deploys only offline/ until the page is cleared for relaunch.
# To relaunch, revert this commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: offline
      - id: deployment
        uses: actions/deploy-pages@v4
