name: Release page

# Rebuilds site/data/releases.json from every product's GitHub releases and deploys the page to
# GitHub Pages. The product repositories stay where they are: their auto-updaters read latest.json
# from their own releases, so this repository only indexes them.

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes, off the hour: GitHub delays and drops scheduled runs at :00 and :30, its
    # busiest minutes, and the '*/30' schedule this replaced never ran once in its first four hours.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  # A product's release workflow can call this right after publishing, instead of waiting for the
  # schedule: POST /repos/AlayaGear/gear-releases/dispatches {"event_type":"product-released"}
  repository_dispatch:
    types: [product-released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch releases
        run: node scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
